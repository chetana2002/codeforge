name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Ports match tests/conftest.py's defaults (5435/6381, not 5432/6379).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge_dev_password
          POSTGRES_DB: codeforge
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black --check
        run: black --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -v --cov=app --cov-report=term-missing

  worker:
    name: Worker (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black --check
        run: black --check .

      - name: Mypy
        run: mypy .

      # Runtime images aren't present on a fresh runner.
      - name: Pre-pull sandbox images
        run: |
          docker pull python:3.12-slim
          docker pull node:22-alpine
          docker pull gcc:13
          docker pull eclipse-temurin:21-jdk-alpine

      - name: Pytest
        run: pytest -v

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci is avoided here too — see frontend/Dockerfile.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # tsc can't see LayoutProps/PageProps until Next.js generates
      # .next/types, which a fresh checkout doesn't have yet.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target production -t codeforge-api:ci ./backend

      - name: Build worker image
        run: docker build --target production -t codeforge-worker:ci ./worker

      - name: Build frontend image
        run: docker build --target production -t codeforge-frontend:ci ./frontend

  e2e:
    name: End-to-end (docker compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      # Dev targets, not the production images built above — this is the
      # config being verified end to end.
      - name: Start the stack
        run: docker compose up -d --build postgres redis api worker frontend

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/ready | grep -q '"status":"ok"'; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Run database migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Pre-pull sandbox images
        run: |
          docker pull python:3.12-slim
          docker pull node:22-alpine
          docker pull gcc:13
          docker pull eclipse-temurin:21-jdk-alpine

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3002

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
